name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонуємо репозиторій (сервер опиниться в корені вашого проєкту)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Встановлюємо Java для Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Видаємо права на запуск скрипту в чистому корені
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # 4. Запускаємо збірку додатку
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. Знаходимо файл, перейменовуємо його на Exp2.apk і кладемо в корінь
      - name: Rename APK to Exp2.apk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Помилка: Файл збірки app-debug.apk не знайдено!"
            exit 1
          fi
          mv "$APK_PATH" ./Exp2.apk
          echo "Готово! Файл успішно перейменовано на Exp2.apk"

      # 6. Зберігаємо фінальний Exp2.apk в артефактах для скачування
      - name: Upload Exp2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Exp2-Artifact
          path: ./Exp2.apk
          retention-days: 5
          
