name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантажуємо код із репозиторію
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Налаштовуємо Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Надаємо права файлу gradlew всередині папки Exp2
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew
        working-directory: ./Exp2

      # 4. Запускаємо збірку APK всередині папки Exp2
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ./Exp2

      # 5. Знаходимо створений APK та перейменовуємо його
      - name: Rename APK to Exp2.apk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Помилка: APK файл не знайдено!"
            exit 1
          fi
          mv "$APK_PATH" ./Exp2.apk
          echo "Файл перейменовано в Exp2.apk"

      # 6. Завантажуємо готовий Exp2.apk на GitHub
      - name: Upload Exp2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Exp2-Artifact
          path: ./Exp2.apk
          retention-days: 7
          
