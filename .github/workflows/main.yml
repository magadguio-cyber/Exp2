name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачуємо код репозиторію
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Налаштовуємо Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Автоматично переходимо в папку з Android-проєктом і запускаємо Gradle
      - name: Smart Auto-Build APK
        run: |
          # Шукаємо, у якій саме папці лежить файл gradlew
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          
          if [ -z "$GRADLE_DIR" ]; then
            echo "КРИТИЧНА ПОМИЛКА: Файлу gradlew взагалі немає в репозиторії!"
            exit 1
          fi
          
          echo "Знайдено Android-проєкт у папці: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          # Надаємо права та запускаємо збірку додатка
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 4. Знаходимо готовий файл і перейменовуємо на Exp2.apk
      - name: Find and Rename APK to Exp2.apk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" -o -name "*-debug.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ПОМИЛКА: APK файл не знайдено в каталогах збірки!"
            exit 1
          fi
          
          echo "Знайдено готовий файл за шляхом: $APK_PATH"
          mv "$APK_PATH" ./Exp2.apk
          echo "Файл успішно перейменовано на Exp2.apk"

      # 5. Викладаємо готовий APK для скачування
      - name: Upload Exp2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Exp2-Artifact
          path: ./Exp2.apk
          retention-days: 5
          
