name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачуємо код репозиторію
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Налаштовуємо Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Встановлюємо та налаштовуємо Gradle в систему сервера
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Збираємо APK за допомогою глобального системного Gradle (без ./gradlew)
      - name: Execute Gradle Build
        run: gradle assembleDebug --stacktrace

      # 5. Знаходимо готовий файл та перейменовуємо на Exp2.apk
      - name: Find and Rename APK to Exp2.apk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" -o -name "*-debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Помилка: APK файл не знайдено в каталогах збірки!"
            exit 1
          fi
          mv "$APK_PATH" ./Exp2.apk
          echo "Файл успішно перейменовано на Exp2.apk"

      # 6. Викладаємо готовий APK для скачування
      - name: Upload Exp2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Exp2-Artifact
          path: ./Exp2.apk
          retention-days: 5
          
