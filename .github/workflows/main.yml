name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # Запуск при пуше в main или master
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (необходима для работы Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Даем права на выполнение скрипту gradlew
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew
        # Если ваш Android-проект лежит в подпапке (например, Exp2), 
        # раскомментируйте строку ниже (удалите знак # перед working-directory):
        # working-directory: ./Exp2

      # 4. Запускаем сборку APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        # Если ваш Android-проект лежит в подпапке, 
        # раскомментируйте строку ниже:
        # working-directory: ./Exp2

      # 5. Переименовываем стандартный app-debug.apk в Exp2.apk
      - name: Rename APK to Exp2.apk
        run: |
          # Ищем, где Gradle создал стандартный APK (в корне или подпапке)
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Ошибка: APK файл не найден!"
            exit 1
          fi
          # Переносим и переименовываем его в корень рабочей директории
          mv "$APK_PATH" ./Exp2.apk
          echo "Файл успешно переименован в Exp2.apk"

      # 6. Загружаем готовый APK на GitHub (его можно будет скачать)
      - name: Upload Exp2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Exp2-Artifact
          path: ./Exp2.apk
          retention-days: 7 # Файл будет храниться 7 дней
          
